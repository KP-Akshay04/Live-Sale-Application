<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Live Sale Management ERP</title>
    
    <!-- PWA Core Meta & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/icon-svg.svg" />
    
    <!-- Apple PWA Compatibility -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LiveSale ERP" />
    <link rel="apple-touch-icon" href="/icon-svg.svg" />
    
    <!-- Standard Stylesheets -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  </head>
  <body class="antialiased text-slate-800 bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Live Sale ServiceWorker registered on scope:', registration.scope);
            })
            .catch((error) => {
              console.error('Live Sale ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
