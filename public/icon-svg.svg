<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Rounded container background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer glowing rings -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accent)" stroke-width="8" opacity="0.3" />
  
  <!-- Elegant Central Emblem: Stylized Sales Trend combined with a Box/Truck cabin -->
  <g transform="translate(100, 100)">
    <!-- Main base plate -->
    <path d="M 40 220 L 272 220 L 272 240 L 40 240 Z" fill="url(#accent)" rx="4" />
    
    <!-- Graph bars rising -->
    <rect x="70" y="140" width="30" height="80" rx="6" fill="#38bdf8" />
    <rect x="120" y="90" width="30" height="130" rx="6" fill="#0ea5e9" />
    <rect x="170" y="40" width="30" height="180" rx="6" fill="#0284c7" />
    
    <!-- Bolt/Arrow overlay representing instant/live sales -->
    <path d="M 230 40 L 200 110 L 225 110 L 210 180 L 260 100 L 235 100 Z" fill="#e11d48" />
  </g>
</svg>
